
services:
  # ==========================================
  # PostgreSQL
  # ==========================================
  db:
    image: postgres:17-alpine
    container_name: aqar-lite-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - aqar-network

  # ==========================================
  # Database migrations
  # ==========================================
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder

    container_name: aqar-lite-migrate
    restart: "no"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    command: ["npm", "run", "db:migrate:deploy"]

    depends_on:
      db:
        condition: service_healthy

    networks:
      - aqar-network

  # ==========================================
  # Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner

    container_name: aqar-lite-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: ${API_PREFIX:-/api/v1}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}

      COOKIE_NAME: ${COOKIE_NAME:-aqar_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-aqar_csrf}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}

      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}

    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - aqar-network

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}/api/v1

    container_name: aqar-lite-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - aqar-network

# ==========================================
# Networks
# ==========================================
networks:
  aqar-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
